spring.application.name=pedidos-service

# Base de datos en memoria H2 (modo estandar H2 2.x, GeneratedKeyHolder reemplaza CALL IDENTITY())
spring.datasource.url=jdbc:h2:mem:pedidosdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Inicializacion de esquemas y datos
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logs
logging.level.com.tienda.pedidos=DEBUG

# Configuracion de campanas promocionales
promo.black-friday.activa=true
